<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!---->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkovChain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sibir-blue: #adecff;
            --sibir-dark: #253566;
            --bg-body: #d8d8d8;
            --white: #ffffff;
            --gray: rgb(223, 223, 223);
            --text-main: #2c3e50;
            --text-muted: #7f8d81;
            --border-color:#253566;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(90deg, #ffffff,#adecff); 
            color: #03155e; 
            margin: 0; 
            display: grid; 
            grid-template-columns: 350px 1fr; 
            gap: 20px; 
            padding: 20px; 
            height: 100vh;
            box-sizing: border-box;
        }

        .sidebar { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow-y: auto; 
            position: sticky; 
            top: 20px; 
            height: calc(100vh - 100px);
        }
        .setting-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 18px;
        }

        .setting-group label {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .setting-group input {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1.5px solid var(--sibir-blue);
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }

        .coherence-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .coherence-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--gray);
            cursor: pointer;
            transition: 0.2s;
        }

        .coherence-btn.active {
            background: var(--sibir-blue);
            color: var(--sibir-dark);
        }

        .switch-label {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--gray);
            border-radius: 999px;
            transition: 0.3s;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }    

        .switch input:checked + .slider {
            background: var(--sibir-blue);
        }

        .switch input:checked + .slider::before {
            transform: translateX(24px);
        } 

        .main { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            top: 20px;
            height: calc(100vh - 100px);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-line;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--sibir-blue);
            color: var(--sibir-dark);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--gray);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .chat-panel-input {
            padding: 14px 16px;
            display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
        }
        .chat-panel-input textarea {
            flex: 1; border: 1.5px solid var(--sibir-blue); border-radius: 14px;
            padding: 10px 14px; font-family: inherit; font-size: 0.88rem;
            resize: none; outline: none; height: 44px; max-height: 120px;
            box-sizing: border-box; line-height: 1.4; display: block; margin: 0;
        }
        .chat-panel-input .send-btn {
            width: 44px; height: 44px; border-radius: 50%; background: var(--sibir-blue);
            color: white; border: none; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; flex-shrink: 0;
        }
        .chat-panel-input .send-btn:hover { background: var(--sibir-dark); }
        .chat-empty { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: auto; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Настройки:</h2>
        <div class="setting-group">
            <label for="contextSize">Количество слов в контексте</label>
            <input type="number" id="contextSize" min="1" max="10" value="3">
        </div>
        <div class="setting-group">
            <p>Связность текста</p>

            <div class="coherence-buttons">

                <button
                    class="coherence-btn active"
                    data-value="0.3">
                    Низкая
                </button>

                <button
                    class="coherence-btn"
                    data-value="0.6">
                    Средняя
                </button>
                <button
                    class="coherence-btn"
                    data-value="0.9">
                    Высокая
                </button>
            </div>
        </div>
        <div class="setting-group">

            <label class="switch-label">
                Генерировать демотиватор
            </label>

            <label class="switch">

                <input
                    type="checkbox"
                    id="demotivatorToggle"
                >

                <span class="slider"></span>

            </label>

        </div>
        <div class="setting-group">
            <label for="responseLength">Длина ответа</label>
            <input type="number" id="responseLength" min="1" max="200" value="50">
        </div>
    </div>

    <div class="main">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty" id="chatEmpty">Сообщений пока нет. Напишите что-нибудь!</div>
        </div>
        
        <div class="chat-panel-input">
            <textarea id="chatReplyInput" placeholder="Ответить..." rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatReply();}"></textarea>
            <button class="send-btn" onclick="sendChatReply()">➤</button>
        </div>
    </div>
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatReplyInput');
        const chatEmpty = document.getElementById('chatEmpty');
        const STORAGE_KEY = 'markov_chat_messages';
        const SETTINGS_KEY = 'markov_chat_settings';
        const contextSizeInput = document.getElementById('contextSize');
        const responseLengthInput = document.getElementById('responseLength');
        const demotivatorToggle = document.getElementById('demotivatorToggle');

        const coherenceButtons =
            document.querySelectorAll('.coherence-btn');

        let meaningfulness = 0.3;

        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            loadSettings();
        });

        contextSizeInput.addEventListener('input', saveSettings);
        responseLengthInput.addEventListener('input', saveSettings);
        demotivatorToggle.addEventListener(
            'change',
            saveSettings
        );
        coherenceButtons.forEach(button => {

            button.addEventListener('click', () => {

                coherenceButtons.forEach(btn =>
                    btn.classList.remove('active')
                );

                button.classList.add('active');

                meaningfulness =
                    Number(button.dataset.value);

                saveSettings();

            });

        });
        async function sendChatReply() {
            const text = chatInput.value.trim();
            if (!text) return;

            //добавляем сообщение пользователя
            addMessage(text, 'user');
            saveMessages();

            //очищаем поле
            chatInput.value = '';
            chatInput.style.height = '44px';

            //скрываем заглушку
            if (chatEmpty) chatEmpty.style.display = 'none';

            const settings = {
                order: Number(contextSizeInput.value),
                length: Number(responseLengthInput.value),
                demotivator: demotivatorToggle.checked,
                meaningfulness: meaningfulness
            };

            const botResponse = await generateBotResponse(text, settings); 
            if (botResponse) {
                addMessage(botResponse, 'bot');
                saveMessages();
            }
        }

        function addMessage(text, sender) {
            const msgEl = document.createElement('div');
            msgEl.className = `message ${sender}`;
            msgEl.textContent = text;
            chatMessages.appendChild(msgEl);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function saveMessages() {
            const messages = Array.from(chatMessages.querySelectorAll('.message')).map(msg => ({
                text: msg.textContent,
                sender: msg.classList.contains('user') ? 'user' : 'bot'
            }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        function loadMessages() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                const messages = JSON.parse(stored);
                if (messages.length > 0) {
                    if (chatEmpty) chatEmpty.style.display = 'none';
                    messages.forEach(({text, sender}) => addMessage(text, sender));
                }
            }
        }

        function saveSettings() {
            const settings = {
                order: Number(contextSizeInput.value),
                length: Number(responseLengthInput.value),
                demotivator: demotivatorToggle.checked,
                meaningfulness: meaningfulness
            };

            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        }

        function loadSettings() {
            const stored = localStorage.getItem(SETTINGS_KEY);

            if (!stored) return;

            const settings = JSON.parse(stored);

            if (settings.order !== undefined) {
                contextSizeInput.value = settings.order;
            }

            if (settings.length !== undefined) {
                responseLengthInput.value = settings.length;
            }
            if (settings.demotivator !== undefined) {
                demotivatorToggle.checked =
                    settings.demotivator;
            }

            if (settings.meaningfulness !== undefined) {

                meaningfulness =
                    settings.meaningfulness;

                coherenceButtons.forEach(button => {

                    button.classList.remove('active');

                    if (
                        Number(button.dataset.value)
                        === meaningfulness
                    ) {
                        button.classList.add('active');
                    }

                });
            }
        }

        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        async function generateBotResponse(userText, settings) {
            const response = await fetch("http://127.0.0.1:8000/api/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: userText, length: settings.length, order: settings.order, demotivator: settings.demotivator, meaningfulness: settings.meaningfulness})
        });

        const data = await response.json();

        return data.reply;
    }
    </script>
</body>
</html>
